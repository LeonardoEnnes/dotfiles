name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ShellCheck + Zsh)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar linters
        run: sudo apt-get update -yqq && sudo apt-get install -yqq shellcheck zsh
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh scripts/modules/*.sh
      - name: Bash syntax
        run: |
          for f in scripts/*.sh scripts/modules/*.sh; do bash -n "$f"; done
      - name: Zsh syntax
        run: |
          zsh -n config/zsh/.zshrc
          zsh -n config/zsh/.p10k.zsh
      - name: Gitconfig válido
        run: git config -f config/git/.gitconfig --list > /dev/null

  install:
    name: Instalação repetível
    runs-on: ubuntu-24.04
    needs: lint
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dotfiles
      - name: Primeira execução
        run: bash dotfiles/scripts/install.sh
      - name: Segunda execução
        run: bash dotfiles/scripts/install.sh
      - name: Verificar ferramentas e links
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          source "$HOME/.nvm/nvm.sh"
          export PATH="$HOME/.local/bin:$PATH"
          java -version
          mvn -v
          node -v
          pnpm -v
          yq --version
          uv --version
          test -L "$HOME/.zshrc"
          test -L "$HOME/.gitconfig"
          test -e "$HOME/.zshrc"
          test -e "$HOME/.gitconfig"
          bash dotfiles/scripts/doctor.sh
