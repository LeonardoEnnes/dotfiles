[boot]
systemd=true

# Usuário padrão ao abrir a distro. Descomente e troque pelo seu usuário.
# [user]
# default=leonardo

[interop]
# Não adiciona o PATH do Windows ao Linux. Deixa o zsh bem mais rápido
# (menos pastas para varrer no completion). O `code` continua funcionando
# pelo atalho em ~/.local/bin criado no install.sh.
appendWindowsPath=false

[automount]
# Permite chmod/permissões Linux em arquivos de /mnt/c
options="metadata,umask=22,fmask=11"